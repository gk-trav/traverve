    function closesearch() {
        $("#searchModal").modal("hide");
        $("#modaltitle").html("");
        $("#videopop").attr("src", "");
    }

    function transformString(string) {
        string = string.trim().replace(/ /g, '-');
        string = string.replace(/[^A-Za-z0-9\-]/g, '');
        string = string.replace(/\s+-\s*|\s*-\s+/g, '-');
        return string.replace(/-+/g, '-');
    }

    function searchforcity() {
        $("#searchpopup").modal("show");


    }

    function closecitypop() {
        $("#searchpopup").modal("hide");
    }


    function searchcity(check = null) {
        var srchkey = $("#searchfield").val();
        $("#searchresults").html("");
        var json = {};


        if (srchkey.length >= 3) {

            if (check != null) {
                json = {
                    "type": "country",
                    "search_key": srchkey,
                    "search_id": check
                }
            } else {
                json = {
                    "type": "destination",
                    "search_key": srchkey,

                }
            }


            $.ajax({
                url: "<?= base_url() ?>/getsearchbykey",
                type: 'post',
                dataType: 'json',
                data: JSON.stringify(json)
            }).done(function (res) {
                // var response = JSON.parse(res);
                var list = res.list;
                list.forEach(element => {
                    var html = '<a href="<?= base_url() ?>city/' + transformString(element.city.toLowerCase()) + '/' + element.id + '" class="searchlink">' +
                        '<div class="my-3 d-flex align-items-center justify-content-between">' +
                        '<img width="15" height="20" src="<?= base_url() ?>assets/location_searchicon.png">' + '<div class="mx-2" style="width:90%"><p class="m-0">' + element.city + ', ' + element.country + '</p></div></div></a>';

                    $("#searchresults").append(html);
                });
            });
        }

    }
</script>
